version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directories: ["/", "/demo"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  # The Prometheus, Grafana and Jaeger images of the demo.
  - package-ecosystem: docker-compose
    directory: /demo
    schedule:
      interval: weekly
    groups:
      demo:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
