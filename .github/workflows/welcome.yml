name: welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  greet:
    name: greet first-time contributors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.sender.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association || github.event.pull_request.author_association)
    # pull-requests is needed to list and comment on pull requests, not only issues.
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      IS_PR: ${{ github.event_name == 'pull_request_target' }}
      ISSUE_MESSAGE: |
        thanks for opening your first issue here, someone will get back to you soon.
        if you want to build something yourself, the [good first issues](https://github.com/${{ github.repository }}/labels/good%20first%20issue) are a nice place to start, and a star on the repo helps other people find it.
      PR_MESSAGE: |
        thanks for your first pull request here. checks from forks wait for a maintainer to approve them, so they may sit for a bit, that's normal.
        [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md) has the checklist, and a star on the repo helps other people find it.
    steps:
      # Counts only the same kind as this event, by this author, opened before it.
      - name: comment on a first issue or pull request
        # bash here runs with pipefail, so a failed lookup fails the step instead of greeting.
        shell: bash
        run: |
          earlier=$(gh api --paginate "repos/$REPO/issues?state=all&creator=$AUTHOR&per_page=100" \
            --jq ".[] | select((.pull_request != null) == $IS_PR) | select(.number < $NUMBER) | .number" | wc -l)
          if [ "$earlier" -ne 0 ]; then
            echo "not a first contribution"
            exit 0
          fi
          if [ "$IS_PR" = "true" ]; then msg=$PR_MESSAGE; else msg=$ISSUE_MESSAGE; fi
          gh api "repos/$REPO/issues/$NUMBER/comments" -f body="$msg" >/dev/null
