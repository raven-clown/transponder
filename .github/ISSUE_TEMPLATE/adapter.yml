name: New adapter
description: Connect transponder to a new system through one of its plugin interfaces.
labels: [adapter, enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Adapters are self-contained, so they're the easiest way to add something big to transponder.

        **How to write it**
        - Title: "Add <name> <kind>", such as "Add Gemini provider".
        - Link the docs of the system you want to connect to.
        - Say how it can be tested without network, such as a fake server or recorded responses.
        - A provider implements the Provider interface in `internal/provider` and lives in `internal/provider/<name>`. Copy the `openai` or `ollama` adapter, register the type with one entry in `internal/provider/registry/registry.go`, and test against an `httptest` server that replays real responses.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of adapter
      options:
        - "LLM provider (`internal/provider`)"
        - "Wire format (`internal/dialect`)"
        - "Storage backend (`internal/store`)"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: What it connects to
      description: The product or protocol, its version and a link to its docs.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Who would use it, and what they do today without it.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config sketch
      description: How a user would turn it on.
      render: yaml
  - type: textarea
    id: testing
    attributes:
      label: How to test it without network
      description: A fake server, recorded responses or an embedded mode.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: "Would you like to build it?"
      options:
        - "Yes"
        - Yes, with some help
        - "No"
    validations:
      required: true
