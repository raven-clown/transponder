profile: cover.out
threshold:
  total: 80
exclude:
  paths:
    # The release tool only runs git and the GitHub API; its logic is in internal/update.
    - internal/tools/
    # Test helpers: the suites every store runs, and the Postgres schema a test gets.
    - internal/store/storetest/
    - internal/store/postgres/pgtest/
    - internal/limits/limitstest/
